# Render Blueprint — API as Docker web service
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render → "New Blueprint Instance" → select this file.
# Then set secret env vars in the Render dashboard (JWT_SECRET, RELAYER_PRIVATE_KEY, etc.).
#
# Frontend stays on Vercel (originshear-frontend/). After both are live:
#   1. Set FRONTEND_URL on this API to your Vercel URL (https://….vercel.app)
#   2. Set VITE_API_BASE_URL on Vercel to this service URL (https://originshear-api.onrender.com)

services:
  - type: web
    name: originshear-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CHAIN_NETWORK
        value: celoSepolia
      - key: CELO_SEPOLIA_RPC_URL
        value: https://forno.celo-sepolia.celo-testnet.org
      - key: CELO_RPC_URL
        value: https://forno.celo.org
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: AUTH_CHALLENGE_TTL_SECONDS
        value: "300"
      - key: ENABLE_ONCHAIN_ROLE_RESOLUTION
        value: "true"
      - key: IPFS_DEV_FALLBACK
        value: "false"
      - key: IPFS_GATEWAY
        value: https://ipfs.io/ipfs
      # --- secrets / project-specific (set in Render dashboard) ---
      - key: JWT_SECRET
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: GRAPHQL_ENDPOINT
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: HARVEST_LEDGER_ADDRESS
        sync: false
      - key: FARMER_MARKET_ADDRESS
        sync: false
      - key: PROOF_OF_ORIGIN_VERIFIER_ADDRESS
        sync: false
      - key: INDUSTRY_MARK_REGISTRY_ADDRESS
        sync: false
      - key: NEWS_BULLETIN_ADDRESS
        sync: false
      - key: GAS_SUBSIDY_POOL_ADDRESS
        sync: false
      - key: DISPUTE_RESOLUTION_ADDRESS
        sync: false
      - key: REPUTATION_SYSTEM_ADDRESS
        sync: false
      - key: PRICE_ORACLE_ADDRESS
        sync: false
      - key: MULTI_SIG_TREASURY_ADDRESS
        sync: false
