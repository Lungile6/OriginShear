server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://ipfs.io https://*.ipfs.io; connect-src 'self' http://localhost:3000 http://127.0.0.1:8545 https://originshear.onrender.com https://forno.celo.org https://forno.celo-sepolia.celo-testnet.org https://*.g.alchemy.com https://ipfs.io https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://explorer-api.walletconnect.com https://rpc.walletconnect.com https://rpc.walletconnect.org https://pulse.walletconnect.org https://api.web3modal.org https://*.blockscout.com; frame-src 'self' https://verify.walletconnect.com https://verify.walletconnect.org https://*.walletconnect.com https://*.walletconnect.org; worker-src 'self' blob:;" always;

  # SPA client-side routing (mirrors vercel.json rewrites)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed Vite assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
